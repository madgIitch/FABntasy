name: encrypted-database-backup
on:
  schedule: [{ cron: "17 2 * * *" }]
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  backup:
    environment: production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create encrypted custom-format backup
        env:
          DATABASE_URL: "${{ secrets.BACKUP_DATABASE_URL }}"
          AGE_RECIPIENT: "${{ vars.BACKUP_AGE_RECIPIENT }}"
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::BACKUP_DATABASE_URL is not configured in the production-backup environment"
            exit 1
          fi
          if [[ -z "$AGE_RECIPIENT" ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT is not configured in the production-backup environment"
            exit 1
          fi
          AGE_RECIPIENT="$(printf '%s' "$AGE_RECIPIENT" | tr -d '\r\n')"
          # Supabase production currently runs PostgreSQL 17. pg_dump must be
          # the same major version as the server (or newer).
          sudo apt-get update
          sudo apt-get install -y age
          if ! printf '' | age --encrypt --recipient "$AGE_RECIPIENT" --output /dev/null; then
            echo "::error::BACKUP_AGE_RECIPIENT is not a valid age recipient"
            exit 1
          fi
          umask 077
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL \
            --volume "$GITHUB_WORKSPACE:/backup" \
            --workdir /backup \
            postgres:17 \
            sh -c 'umask 077; pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file=backup.dump'
          test -s backup.dump
          age --recipient "$AGE_RECIPIENT" --output "fabntasy-${GITHUB_RUN_ID}.dump.age" backup.dump
          rm backup.dump
      - uses: actions/upload-artifact@v4
        with: { name: "encrypted-backup-${{ github.run_id }}", path: "*.dump.age", retention-days: 30, if-no-files-found: error }
  alert:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ -z "$OPERATIONS_ALERT_WEBHOOK" ]]; then
            echo "::warning::OPERATIONS_ALERT_WEBHOOK is not configured; skipping backup alert"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$OPERATIONS_ALERT_WEBHOOK" \
            -H 'content-type: application/json' \
            --data '{"event":"database_backup_failed","run":"${{ github.run_id }}"}'
        env:
          OPERATIONS_ALERT_WEBHOOK: "${{ secrets.OPERATIONS_ALERT_WEBHOOK }}"
