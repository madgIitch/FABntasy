name: performance-integration
on:
  workflow_dispatch:
jobs:
  realistic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: canastio_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANASTIO_TEST_DATABASE: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canastio_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canastio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: node scripts/test-data.mjs cycle --profile realistic --seed 20092026 --run-id perf-realistic --clock 2026-09-12T10:00:00+02:00
      - run: pnpm test:performance
      - uses: actions/upload-artifact@v4
        with: { name: performance-report, path: progress/performance-report.json }
